[project]
name = "maize-advisor-ml"
version = "0.1.0"
description = "ML pipelines for Maize Advisor"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.0.0",
    "transformers",
    "peft",
    "sentencepiece",
    "scikit-learn",
    "lightgbm",
    "statsmodels",
    "polars",
    "pandas",
    "mlflow",
    "dvc"
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = []

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
