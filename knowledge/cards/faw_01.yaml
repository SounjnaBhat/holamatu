id: faw_01
intent_tags: [pest_advice, fall_armyworm]
text_en: "Fall Armyworm (Spodoptera frugiperda) causes significant whorl damage in maize. Apply Emamectin benzoate 5% SG at 0.4 g/litre of water when damage exceeds 10%."
text_kn: "ಫಾಲ್ ಆರ್ಮಿವರ್ಮ್ (ಲದ್ದಿ ಹುಳು) ಮೆಕ್ಕೆಜೋಳಕ್ಕೆ ಹಾನಿ ಮಾಡುತ್ತದೆ. 10% ಹಾನಿ ಮೀರಿದಾಗ ಎಮಾಮೆಕ್ಟಿನ್ ಬೆಂಜೊಯೇಟ್ ಸಿಂಪಡಿಸಿ."
source: "CIB&RC, ICAR-IIMR"
